name: VPN Gate Node Check

on:
  schedule:
    # 每天早上北京时间 4:00 运行（对应 UTC 时间前一天 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '32'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

# 必须权限配置
permissions:
  contents: read
  pages: write
  id-token: write

# 防止多个部署任务并发冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # 任务 1：运行脚本并打包文件
  # ==========================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate worker secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host）"
            exit 1
          fi
          echo "检测域名已配置：${DOMAIN}"

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '32' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0'
        run: python vpngate.py

      # 诊断打印，确认生成成功
      - name: Ensure public directory exists
        run: |
          mkdir -p public
          echo "=== 检查 public 目录下的文件 ==="
          ls -la public/
          echo "=== 统计 public 目录文件数量 ==="
          find public -type f | wc -l

      # 配置 Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上传产物，使用最稳定的 v3 版本
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # ==========================================
  # 任务 2：专门负责部署到 GitHub Pages
  # ==========================================
  deploy:
    # 关键：必须等待 build 任务成功完成后，才开始部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "订阅地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
